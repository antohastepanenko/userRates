# docker-compose for local development of the Rates platform.
# Brings up Postgres, applies migrations via the MigrationService, then starts
# user-api / finance-api / rates-worker / api-gateway.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rates-postgres
    environment:
      POSTGRES_USER: rates
      POSTGRES_PASSWORD: rates
      POSTGRES_DB: rates
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rates -d rates"]
      interval: 5s
      timeout: 3s
      retries: 10

  migration:
    build:
      context: .
      dockerfile: src/Services/Migration/Rates.MigrationService.Host/Dockerfile
    container_name: rates-migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__IdentityDb: "Host=postgres;Database=rates_identity;Username=rates;Password=rates"
      ConnectionStrings__FinanceDb: "Host=postgres;Database=rates_finance;Username=rates;Password=rates"
      Logging__LogLevel__Default: Information
    restart: on-failure

  user-api:
    build:
      context: .
      dockerfile: src/Services/User/Rates.UserService.Api/Dockerfile
    container_name: rates-user-api
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: "Host=postgres;Database=rates_identity;Username=rates;Password=rates"
      Jwt__Issuer: "rates"
      Jwt__Audience: "rates.api"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-dev-only-do-not-use-in-production-1234567890}"
      Jwt__AccessTokenLifetimeMinutes: 15
      Jwt__RefreshTokenLifetimeDays: 30
      InternalServices__SharedToken: "${INTERNAL_SERVICE_TOKEN:-dev-only-internal-service-token-1234567890}"
    ports:
      - "5101:8080"

  finance-api:
    build:
      context: .
      dockerfile: src/Services/Finance/Rates.FinanceService.Api/Dockerfile
    container_name: rates-finance-api
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      user-api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FinanceDb: "Host=postgres;Database=rates_finance;Username=rates;Password=rates"
      Jwt__Issuer: "rates"
      Jwt__Audience: "rates.api"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-dev-only-do-not-use-in-production-1234567890}"
      ServiceEndpoints__UserServiceBaseUrl: "http://user-api:8080"
      InternalServices__SharedToken: "${INTERNAL_SERVICE_TOKEN:-dev-only-internal-service-token-1234567890}"
    ports:
      - "5102:8080"

  rates-worker:
    build:
      context: .
      dockerfile: src/Services/RatesWorker/Rates.RatesWorker.Host/Dockerfile
    container_name: rates-worker
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__FinanceDb: "Host=postgres;Database=rates_finance;Username=rates;Password=rates"
      CbrRates__Url: "http://www.cbr.ru/scripts/XML_daily.asp"
      CbrRates__UpdateInterval: "01:00:00"
      CbrRates__RunOnStartup: "true"

  api-gateway:
    build:
      context: .
      dockerfile: src/Services/ApiGateway/Rates.ApiGateway.Api/Dockerfile
    container_name: rates-api-gateway
    depends_on:
      user-api:
        condition: service_started
      finance-api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Issuer: "rates"
      Jwt__Audience: "rates.api"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-dev-only-do-not-use-in-production-1234567890}"
      RateLimiting__AuthPermitLimit: 10
      RateLimiting__AuthWindowSeconds: 60
      RateLimiting__ApiPermitLimit: 120
      RateLimiting__ApiWindowSeconds: 60
      Health__UserServiceUrl: "http://user-api:8080/health/ready"
      Health__FinanceServiceUrl: "http://finance-api:8080/health/ready"
      ReverseProxy__Clusters__user-api__Destinations__primary__Address: "http://user-api:8080"
      ReverseProxy__Clusters__finance-api__Destinations__primary__Address: "http://finance-api:8080"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
    ports:
      - "8080:8080"

volumes:
  pgdata:
    driver: local